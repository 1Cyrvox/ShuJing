# The docs site: https://zensical.org/docs/setup/basics/
# Build it with `just build-docs` (renders the examples and writes the reference first) into
# docs/site/, preview it with `just serve-docs`. Its paths are this folder's. Its navigation is
# its folders': the `.nav.yml` files (awesome-nav).

[project]
site_name = "数境 ShuJing"
site_url = "https://www.aipaikj.top/"
site_description = "中文数学动画引擎 · 基于 ManimGX · 极速 3D 数学动画"
site_author = "爱派未来科技"
copyright = "&copy; 2026 爱派未来科技 · 基于 <a href=\"https://github.com/1Cyrvox/ShuJing\">ManimGX</a>（<a href=\"https://github.com/1Cyrvox/ShuJing/blob/main/LICENSE\">MIT 许可证</a>）"
repo_url = "https://github.com/1Cyrvox/ShuJing"
repo_name = "1Cyrvox/ShuJing"
docs_dir = "content"
site_dir = "site"
watch = ["templates"]
extra_css = ["stylesheets/manimgx.css", "stylesheets/sidebars.css"]
# manimgx.js loads KaTeX only when a page has mathematics.
extra_javascript = ["javascripts/manimgx.js"]

[project.theme]
custom_dir = "overrides"
favicon = "images/favicon.svg"
language = "zh"
features = [
  # a page's one action: copying it as Markdown (the llmstxt plugin below writes it)
  "content.action.copy",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # a page carries only the navigation it shows: half the site's HTML
  "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Start with the system's preference; the toggle then switches between light and dark.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "切换到浅色模式"

# 数境页脚配置（overrides/partials/academa.html）
[project.extra]
social_description = "数境 — 中文数学动画引擎，基于 ManimGX 中文适配衍生发行版。极速 3D 数学动画，兼容 Manim CE API。"
social = [
  { icon = "fontawesome/brands/github", name = "GitHub", link = "https://github.com/1Cyrvox/ShuJing" },
]

# A static sharing card: crawlers receive its absolute URL in the rendered head.
# Regenerate with `uv run --frozen python -m scripts.showcase.social`.
[project.extra.social_image]
path = "images/social-preview.png"
width = 1200
height = 630
alt = "数境 ShuJing — 中文数学动画引擎，基于 ManimGX 中文适配衍生发行版"

# Setting any extension replaces Zensical's defaults, so every extension is listed.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = { repo_url_shorthand = true, user = "1Cyrvox", repo = "ShuJing" }
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# the Welcome page is the README, included (its paths are the repository's)
pymdownx.snippets = { base_path = ["."], check_paths = true }
# its URLs of the site's own as the site's paths, so a preview shows its images (docs/links.py)
"docs.links" = {}
# a reference to the API previews its target on hover, as a link does (docs/previews.py)
"docs.previews" = {}
# a picture named by its scene, `![](film:CircleExample)`, shows its film's still (docs/films.py)
"docs.films" = {}
# mkdocstrings finds docs/templates/, which Zensical passes on as written (docs/mkdocstrings.py)
"docs.mkdocstrings" = {}
# a Python block that defines a scene shows the scene's film above its code (docs/examples.py)
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  { name = "python", class = "python", validator = "docs.examples.validate", format = "docs.examples.fence" },
  { name = "py", class = "py", validator = "docs.examples.validate", format = "docs.examples.fence" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# every link to a page of the site previews its target on hover (a heading's ¶ and a
# footnote don't); docs/previews.py marks the references to the API
[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = ["*"]

# The navigation, from the folders and their .nav.yml files
[project.plugins.awesome-nav]

# For agents: each page as Markdown beside it (/user-guide/quickstart/index.md, which its Copy
# as Markdown button copies), all of them in llms-full.txt, and llms.txt: this primer, which
# the README tells an agent to follow (tests/docs/test_llms.py runs its scene and checks the
# names it teaches), then a list of every page's Markdown
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = '''
ManimGX 是一个面向 AI 智能体的自包含动画引擎：它从 Python 场景生成数学和 3D 视频。
场景使用 Manim Community Edition 的 API，ManimGX 为其全部标注了类型，因此类型检查器
能在渲染前发现错误。Rust 核心在 GPU 上绘制每一帧，用 Typst 排版文本和 LaTeX 数学公式，
并将视频及其声音编码为 MP4。动画在每一帧的时间点求值，基于时间的模拟使用独立于输出
帧率的固定时钟。逐帧回调应从时间或其他对象派生状态，而非计数帧。inspect 命令在不生成
视频的情况下运行场景，打印其时间线和布局问题（例如文本覆盖其他文本），并写出故事板。
在 Web 浏览器中，Pyodide 在 Web Worker 中运行相同的场景，核心的 WebAssembly 构建用
WebGPU 绘制它们。

以下是被要求用 ManimGX 制作视频的 AI 智能体的操作指南。请按顺序执行。

## 1. 安装

```sh
uv tool install --python 3.14 manimgx   # 将 `manimgx` 放到 PATH 上
manimgx --version
```

- 保留 `--python 3.14`：ManimGX 需要 Python 3.13 或 3.14，若机器上没有，uv 会下载一个。不加它，uv 会取机器的默认 Python（macOS 的是 3.9），然后找不到 `manimgx`。
- 没有 `uv`？安装它：`curl -LsSf https://astral.sh/uv/install.sh | sh`，然后 `source $HOME/.local/bin/env`（或调用 `~/.local/bin/uv`）。
- 不安装也能用：`uvx --python 3.14 manimgx <命令>` 运行相同的 CLI。
- pip 在 Python 3.13 或 3.14 的虚拟环境中可用（更旧的 Python 找不到 `manimgx`）：`python3.14 -m venv .venv && .venv/bin/pip install manimgx`。
- ManimGX 不是 `manim` 包：不要安装 `manim`、ffmpeg 或 LaTeX，也不要 `import manim`。
- 它在 GPU 上绘制：macOS 用 Metal，Windows 用 Direct3D 12，Linux 用 Vulkan。没有 GPU 时（服务器、容器）在 CPU 上绘制，无需额外安装：Linux wheel 自带 Mesa 的 lavapipe。

## 2. 编写场景

保存为 `scene.py`：

```python
import manimgx as m


class SquareToCircle(m.Scene):
    def construct(self) -> None:
        square = m.Square(side_length=3, color=m.BLUE, fill_opacity=0.5)
        circle = m.Circle(radius=1.6, color=m.PINK, fill_opacity=0.5)
        self.play(m.Create(square))
        self.play(m.Transform(square, circle))
        self.wait()
```

- API 是 Manim CE 的，每个名称都在包上：`m.Circle`、`m.MathTex`、`m.Create`、`m.UP`、`m.BLUE`。
- 时间只在 `self.play(...)`（默认 1 秒，可用 `run_time=` 指定）和 `self.wait(seconds)` 中流逝；`self.add(...)` 显示一个 mobject 但不动画。
- 画面为 14.2 × 8 单位，以原点为中心：将所有内容保持在 x ∈ [-7, 7]、y ∈ [-4, 4] 范围内。

## 3. 检查，然后渲染

```sh
manimgx inspect scene.py     # 故事板、时间线和 2D 布局检查；有问题则退出码为 1
manimgx render scene.py      # 在 scene.py 旁写出 SquareToCircle.mp4 并打印其路径
```

- `inspect` 采样 play 和 wait 的结束点。它列出每个 play 及其代码行号，报告 2D 布局问题，并写出 `<Scene>.storyboard.png`，其中问题被勾勒并编号。如果能查看图片就看一看。修复问题后再次 inspect。3D 场景会得到故事板和时间线；布局检查被跳过。
- `manimgx inspect scene.py -t 1.5,end` 改为检查 1.5 秒和结尾处的帧。可重复 `-t` 或用逗号分隔时间；`-o detail.png` 命名输出。图片按时间顺序排列，每张六帧；多余的写到 `…-2.png`，以此类推。不加 `end` 时，检查在最后一个请求帧的 play 之后停止。只有被采样的时刻会被检查。
- `render` 生成 1920×1080、60 fps；`-r 1280x720 --fps 30` 更快，适合草稿。一个文件含多个场景时需要指定场景名：`manimgx render scene.py MyScene`。
- 出错时打印失败的场景代码行，对于名称错误还会给出提示（`ShowCreation is Create in ManimGX`）。
- `no GPU adapter` 表示命令在隐藏 GPU 的沙箱中运行：在沙箱外运行（如果你的工具需要批准，请询问用户）。

## 4. 展示

为用户打开视频，并告知其路径：macOS 上 `open SquareToCircle.mp4`，Linux 上 `xdg-open SquareToCircle.mp4`。

## 5. API 速查表

- 图形：`Square`、`Circle`、`Rectangle`、`Triangle`、`Polygon([x, y, 0], ...)`、`Line`、`Arrow`、`Dot`、`Brace(mob, m.DOWN)`、`NumberPlane`。点为 `[x, y, 0]`。
- 文本：`Text("纯文本")`、`MathTex(r"a^2 + b^2 = c^2")`（LaTeX 数学）、`Tex(r"文本和 $x^2$")`。使用原始字符串。
- 动画：`Create`、`Write`、`FadeIn(mob, shift=m.UP)`、`FadeOut`、`Transform`、`ReplacementTransform`、`TransformMatchingTex`、`GrowFromCenter`、`Indicate`、`Circumscribe`、`Rotate(mob, m.PI / 2)`；用 `AnimationGroup`、`LaggedStart`、`Succession` 组合。`mob.animate.shift(m.RIGHT).scale(2)` 为任意方法调用生成动画。
- 放置：`.to_edge(m.UP)`、`.next_to(other, m.RIGHT, buff=0.3)`、`.move_to([x, y, 0])`、`.shift(2 * m.LEFT)`、`.scale(k)`、`m.VGroup(a, b).arrange(m.DOWN)`。
- 样式：`color=m.YELLOW`、`fill_opacity=0.5`、`stroke_width=6`、`font_size=48`。白色背景：在 import 之后设 `m.config.background_color = m.WHITE`。
- 图表：`axes = m.Axes(x_range=[-3, 3], y_range=[-2, 2])`，然后 `axes.plot(lambda x: x**2, color=m.BLUE)`。
- 声音：`self.add_sound("click.wav")` 立即开始播放声音；`self.play(m.FadeIn(mob), m.Sound("whoosh.mp3"))` 随动画播放声音。
- 旁白：`self.say("[x 平方]的导数是[二 x]。", m.Indicate(a), m.Write(b))` 在方括号标记的词语期间说话并播放每个动画；场景的语音为 `voice = m.voices.Fal("<模型>", ...)`（fal.ai 的文本转语音，由环境变量 FAL_KEY 控制），默认为 ElevenLabs 的 Eleven v3，或任何从文本到 `m.Speech` 的函数。
- 幻灯片：在 play 之间用 `self.next_section("名称")`；`manimgx present scene.py` 在浏览器中打开。

## 6. 查阅

文档如下，每页为 Markdown。用户指南讲述场景的工作方式。参考给出了每个类、其接受
的关键字和示例。画廊给出了三十部影片的代码。https://www.aipaikj.top/llms-full.txt
包含所有页面于一个文件中。
'''

[project.plugins.llmstxt.sections]
"用户指南" = ["index.md", "user-guide/quickstart.md", "user-guide/*.md"]
"参考" = ["reference/index.md", "reference/*.md"]
"画廊" = ["gallery/index.md", "gallery/*.md"]
# what an agent may skip, by llms.txt's convention
"可选" = ["developer-guide/index.md", "developer-guide/*.md", "changelog.md"]

# The reference's pages (docs/content/reference/, written by hand) render the API from the
# docstrings (Google style) with mkdocstrings' `:::` blocks
[project.plugins.mkdocstrings]
custom_templates = "D:/asd/dfghj/manimgx-src/docs/templates"

[project.plugins.mkdocstrings.handlers.python]
paths = ["../src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]

docstring_options ={ ignore_init_summary = true, returns_multiple_items = false, returns_named_value = false }
docstring_section_style = "list"
# what is decorated with `@deprecated` is left out (docs/deprecated.py)
extensions = ["docs.deprecated"]
filters = ["!^_"]
line_length = 88
members_order = "source"
merge_init_into_class = true
modernize_annotations = true
relative_crossrefs = true
separate_signature = true
# an entry reads as a scene writes it (docs/templates/): its name, its call without types (an
# editor shows those), what it takes in words, and its source one click away; a base is told in
# the page's story, not listed
show_bases = false
show_root_full_path = false
show_root_heading = true
show_root_toc_entry = false
show_signature_annotations = false
show_source = true
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
unwrap_annotated = true

[project.plugins.autorefs]
resolve_closest = true
# a link's title repeated its target's heading, HTML and all: most of a reference page's weight
link_titles = false

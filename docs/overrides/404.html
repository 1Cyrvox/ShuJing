{% extends "main.html" %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@600&display=swap');

  .md-sidebar--secondary,
  .md-sidebar--primary {
    display: none !important;
  }
  .md-content {
    display: flex;
  }
  .md-content > .md-content__inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-left: 0;
    margin-right: 0;
    padding: 0;
  }
  .md-content__inner > * {
    max-width: 48rem;
    margin-inline: auto;
  }
  .md-content__inner > .mx-404 {
    max-width: none;
    margin: 0;
  }

  .mx-404 {
    position: relative;
    flex: 1;
    min-height: calc(100vh - 4rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    overflow: hidden;
  }
  .mx-404__aurora {
    position: absolute;
    inset: -10%;
    pointer-events: none;
    z-index: 0;
  }
  .mx-404__aurora::before,
  .mx-404__aurora::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    animation: mx-404-drift 14s ease-in-out infinite;
  }
  .mx-404__aurora::before {
    width: 28rem; height: 28rem;
    top: 5%; left: 10%;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.45), transparent 70%);
  }
  .mx-404__aurora::after {
    width: 26rem; height: 26rem;
    bottom: 0%; right: 12%;
    background: radial-gradient(circle, rgba(236, 72, 153, 0.4), transparent 70%);
    animation-delay: -7s;
  }
  [data-md-color-scheme="slate"] .mx-404__aurora::before {
    background: radial-gradient(circle, rgba(167, 139, 250, 0.5), transparent 70%);
    opacity: 0.6;
  }
  [data-md-color-scheme="slate"] .mx-404__aurora::after {
    background: radial-gradient(circle, rgba(244, 114, 182, 0.45), transparent 70%);
    opacity: 0.6;
  }
  @keyframes mx-404-drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(2.5rem, -2rem) scale(1.08); }
    66%      { transform: translate(-2rem, 2.5rem) scale(0.95); }
  }
  .mx-404__symbols {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .mx-404__symbol {
    position: absolute;
    font-family: 'ZCOOL KuaiLe', var(--md-code-font);
    opacity: 0.06;
    animation: mx-404-float 7s ease-in-out infinite;
  }
  .mx-404__symbol:nth-child(1)  { top: 6%;  left: 4%;  font-size: 3.5rem; animation-delay: 0s;   color: #8b5cf6; }
  .mx-404__symbol:nth-child(2)  { top: 16%; right: 5%; font-size: 4rem;   animation-delay: 1s;   color: #ec4899; }
  .mx-404__symbol:nth-child(3)  { top: 48%; left: 2%;  font-size: 3rem;   animation-delay: 2s;   color: #a78bfa; }
  .mx-404__symbol:nth-child(4)  { top: 70%; right: 3%; font-size: 4.5rem; animation-delay: 3s;   color: #f472b6; }
  .mx-404__symbol:nth-child(5)  { top: 28%; left: 90%; font-size: 3.5rem; animation-delay: 1.5s; color: #c084fc; }
  .mx-404__symbol:nth-child(6)  { top: 80%; left: 8%;  font-size: 3rem;   animation-delay: 2.5s; color: #8b5cf6; }
  .mx-404__symbol:nth-child(7)  { top: 10%; left: 82%; font-size: 2.8rem; animation-delay: 0.5s; color: #ec4899; }
  .mx-404__symbol:nth-child(8)  { top: 62%; left: 92%; font-size: 3.2rem; animation-delay: 3.5s; color: #a78bfa; }
  .mx-404__symbol:nth-child(9)  { top: 40%; left: 94%; font-size: 2.5rem; animation-delay: 2.2s; color: #f472b6; }
  .mx-404__symbol:nth-child(10) { top: 86%; left: 48%; font-size: 3.8rem; animation-delay: 1.8s; color: #c084fc; }
  @keyframes mx-404-float {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50%      { transform: translateY(-2rem) rotate(12deg); }
  }
  .mx-404__inner {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 38rem;
    width: 100%;

  }
  .mx-404__badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.3rem 0.9rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #7c3aed;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(236, 72, 153, 0.12));
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 2rem;
    margin-bottom: 1.2rem;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  [data-md-color-scheme="slate"] .mx-404__badge {
    color: #c4b5fd;
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.12), rgba(244, 114, 182, 0.1));
    border-color: rgba(167, 139, 250, 0.25);
  }
  .mx-404__badge-dot {
    width: 0.5rem; height: 0.5rem;
    border-radius: 50%;
    background: #ec4899;
    box-shadow: 0 0 8px #ec4899;
    animation: mx-404-pulse 2s ease-in-out infinite;
  }
  @keyframes mx-404-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(1.3); }
  }
  .mx-404__hero {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.5rem;
  }
  .mx-404__number {
    font-family: 'ZCOOL KuaiLe', var(--md-text-font);
    font-size: clamp(5.5rem, 20vw, 11rem);
    font-weight: 400;
    letter-spacing: -0.04em;
    line-height: 0.9;
    background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 40%, #c084fc 70%, #a78bfa 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 40px rgba(139, 92, 246, 0.4)) drop-shadow(0 0 60px rgba(236, 72, 153, 0.2));
    animation: mx-404-shimmer 5s ease infinite, mx-404-wobble 6s ease-in-out infinite;
    z-index: 2;
    position: relative;
    display: inline-block;
  }
  @keyframes mx-404-shimmer {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  @keyframes mx-404-wobble {
    0%, 100% { transform: rotate(-2deg); }
    25%      { transform: rotate(1deg); }
    75%      { transform: rotate(-1deg); }
  }
  .mx-404__ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .mx-404__ring--1 {
    width: clamp(6.5rem, 19vw, 10.5rem);
    height: clamp(6.5rem, 19vw, 10.5rem);
    border: 2px solid;
    border-color: #8b5cf6 transparent #ec4899 transparent;
    animation: mx-404-spin 4s linear infinite;
    opacity: 0.6;
  }
  .mx-404__ring--2 {
    width: clamp(8.5rem, 26vw, 14rem);
    height: clamp(8.5rem, 26vw, 14rem);
    border: 2px dashed rgba(192, 132, 252, 0.3);
    animation: mx-404-spin 8s linear infinite reverse;
  }
  .mx-404__ring--3 {
    width: clamp(10.5rem, 33vw, 18rem);
    height: clamp(10.5rem, 33vw, 18rem);
    border: 1px solid rgba(236, 72, 153, 0.12);
    animation: mx-404-spin 16s linear infinite;
  }
  @keyframes mx-404-spin {
    to { transform: rotate(360deg); }
  }
  .mx-404__sparkle {
    position: absolute;
    width: 0.5rem;
    height: 0.5rem;
    background: #ec4899;
    border-radius: 50%;
    box-shadow: 0 0 12px #ec4899, 0 0 24px rgba(236, 72, 153, 0.5);
    animation: mx-404-orbit 4s linear infinite;
  }
  @keyframes mx-404-orbit {
    from { transform: rotate(0deg) translateX(clamp(3.2rem, 9.5vw, 5.2rem)) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(clamp(3.2rem, 9.5vw, 5.2rem)) rotate(-360deg); }
  }
  .mx-404__topic {
    min-height: 5.5rem;
    margin: 1.5rem auto 1rem;
    max-width: 34rem;
  }
  .mx-404__topic-title {
    font-family: 'Noto Serif SC', var(--md-text-font);
    font-size: clamp(1.25rem, 3.8vw, 1.7rem);
    font-weight: 600;
    line-height: 1.55;
    color: var(--md-default-fg-color);
    margin: 0 0 0.6rem;
    letter-spacing: 0.02em;
  }
  .mx-404__topic-title code {
    font-family: var(--md-code-font);
    font-size: 0.82em;
    font-weight: 600;
    color: #8b5cf6;
    background: rgba(139, 92, 246, 0.1);
    padding: 0.1em 0.4em;
    border-radius: 0.4rem;
    border: 1px solid rgba(139, 92, 246, 0.15);
    letter-spacing: 0;
  }
  [data-md-color-scheme="slate"] .mx-404__topic-title code {
    color: #c4b5fd;
    background: rgba(167, 139, 250, 0.12);
    border-color: rgba(167, 139, 250, 0.2);
  }
  .mx-404__topic-sub {
    font-family: 'ZCOOL KuaiLe', var(--md-text-font);
    font-size: clamp(0.9rem, 2.5vw, 1rem);
    color: var(--md-default-fg-color);
    line-height: 1.75;
    margin: 0;
    letter-spacing: 0.03em;
  }
  .mx-404__topic-sub code {
    font-family: var(--md-code-font);
    font-size: 0.88em;
    font-weight: 600;
    color: #ec4899;
    background: rgba(236, 72, 153, 0.12);
    padding: 0.05em 0.3em;
    border-radius: 0.25rem;
    letter-spacing: 0;
  }
  [data-md-color-scheme="slate"] .mx-404__topic-sub code {
    color: #f472b6;
    background: rgba(244, 114, 182, 0.1);
  }
  .mx-404__tools {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
    align-items: center;
    margin-top: 1.8rem;
  }
  .mx-404__search {
    position: relative;
    flex: 1;
    min-width: 13rem;
    max-width: 20rem;
  }
  .mx-404__search-input {
    width: 100%;
    padding: 0.7rem 1rem 0.7rem 2.6rem;
    font-size: 0.88rem;
    color: var(--md-default-fg-color);
    background: rgba(255, 255, 255, 0.6);
    border: 1.5px solid rgba(139, 92, 246, 0.2);
    border-radius: 0.8rem;
    outline: none;
    transition: all 200ms ease;
    box-sizing: border-box;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  [data-md-color-scheme="slate"] .mx-404__search-input {
    background: rgba(26, 27, 38, 0.6);
    border-color: rgba(167, 139, 250, 0.25);
  }
  .mx-404__search-input:focus {
    border-color: #8b5cf6;
    box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
  }
  .mx-404__search-input::placeholder {
    color: var(--md-default-fg-color--light);
  }
  .mx-404__search-icon {
    position: absolute;
    left: 0.85rem; top: 50%;
    transform: translateY(-50%);
    width: 1.05rem; height: 1.05rem;
    color: var(--md-default-fg-color--light);
    pointer-events: none;
  }
  .mx-404__btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.75rem 1.4rem;
    font-size: 0.92rem;
    font-weight: 700;
    border-radius: 0.8rem;
    text-decoration: none;
    transition: all 250ms cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    white-space: nowrap;
  }
  .mx-404__btn svg {
    width: 1.05rem; height: 1.05rem;
    flex-shrink: 0;
  }
  .mx-404__btn--primary {
    color: white;
    background: linear-gradient(135deg, #7c3aed, #db2777);
    box-shadow: 0 4px 16px -4px rgba(139, 92, 246, 0.5), 0 0 24px -8px rgba(236, 72, 153, 0.4);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  }
  .mx-404__btn--primary:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 8px 28px -4px rgba(139, 92, 246, 0.6), 0 0 32px -6px rgba(236, 72, 153, 0.5);
    color: white;
  }
  .mx-404__btn--ghost {
    color: #7c3aed;
    background: rgba(255, 255, 255, 0.6);
    border: 1.5px solid rgba(139, 92, 246, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  [data-md-color-scheme="slate"] .mx-404__btn--ghost {
    color: #c4b5fd;
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(167, 139, 250, 0.3);
  }
  .mx-404__btn--ghost:hover {
    border-color: #8b5cf6;
    color: #8b5cf6;
    transform: translateY(-2px);
  }
  .mx-404__reroll {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.45rem 1rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--md-default-fg-color);
    background: rgba(139, 92, 246, 0.06);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 0.6rem;
    cursor: pointer;
    transition: all 200ms ease;
  }
  .mx-404__reroll:hover {
    color: #8b5cf6;
    border-color: #8b5cf6;
    background: rgba(139, 92, 246, 0.05);
  }
  .mx-404__reroll svg {
    width: 0.85rem; height: 0.85rem;
    transition: transform 400ms ease;
  }
  .mx-404__reroll:hover svg {
    transform: rotate(180deg);
  }
  .mx-404__subtools {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    align-items: center;
    margin-top: 1.2rem;
  }
  .mx-404__back {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.45rem 1rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--md-default-fg-color);
    background: rgba(236, 72, 153, 0.06);
    border: 1px solid rgba(236, 72, 153, 0.3);
    border-radius: 0.6rem;
    cursor: pointer;
    transition: all 200ms ease;
  }
  .mx-404__back:hover {
    color: #ec4899;
    border-color: #ec4899;
    background: rgba(236, 72, 153, 0.05);
  }
  .mx-404__back svg {
    width: 0.85rem; height: 0.85rem;
    transition: transform 200ms ease;
  }
  .mx-404__back:hover svg {
    transform: translateX(-3px);
  }
  .mx-404__divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 1.8rem 0 1rem;
    color: var(--md-default-fg-color--lighter);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
  }
  .mx-404__divider::before,
  .mx-404__divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.25), transparent);
  }
  .mx-404__links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(6rem, 1fr));
    gap: 0.6rem;
    max-width: 34rem;
    margin: 0 auto;
  }
  .mx-404__link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    padding: 0.85rem 0.4rem;
    text-decoration: none;
    color: var(--md-default-fg-color--light);
    background: rgba(255, 255, 255, 0.4);
    border: 1.5px solid rgba(139, 92, 246, 0.1);
    border-radius: 0.8rem;
    transition: all 250ms cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  [data-md-color-scheme="slate"] .mx-404__link {
    background: rgba(255, 255, 255, 0.03);
    border-color: rgba(167, 139, 250, 0.12);
  }
  .mx-404__link:hover {
    color: #8b5cf6;
    border-color: #8b5cf6;
    background: rgba(139, 92, 246, 0.08);
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 20px -6px rgba(139, 92, 246, 0.3);
  }
  [data-md-color-scheme="slate"] .mx-404__link:hover {
    color: #c4b5fd;
    background: rgba(167, 139, 250, 0.1);
  }
  .mx-404__link-icon { font-size: 1.3rem; line-height: 1; }
  .mx-404__link-text { font-size: 0.76rem; font-weight: 500; }
</style>

<div class="mx-404">

  <div class="mx-404__symbols">
    <span class="mx-404__symbol">π</span>
    <span class="mx-404__symbol">∫</span>
    <span class="mx-404__symbol">∂</span>
    <span class="mx-404__symbol">∞</span>
    <span class="mx-404__symbol">√</span>
    <span class="mx-404__symbol">∑</span>
    <span class="mx-404__symbol">θ</span>
    <span class="mx-404__symbol">λ</span>
    <span class="mx-404__symbol">∇</span>
    <span class="mx-404__symbol">ℵ</span>
  </div>

  <div class="mx-404__inner">
    <div class="mx-404__badge">
      <span class="mx-404__badge-dot"></span>
      页面走丢了
    </div>

    <div class="mx-404__hero">
      <div class="mx-404__ring mx-404__ring--3"></div>
      <div class="mx-404__ring mx-404__ring--2"></div>
      <div class="mx-404__ring mx-404__ring--1"></div>
      <div class="mx-404__sparkle"></div>
      <span class="mx-404__number" id="mx-404-number">404</span>
    </div>

    <div class="mx-404__topic" id="mx-404-topic"></div>

    <div class="mx-404__tools">
      <div class="mx-404__search">
        <svg class="mx-404__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" class="mx-404__search-input" placeholder="搜索文档…" id="mx-404-search">
      </div>
      <a href="/" class="mx-404__btn mx-404__btn--primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        回首页
      </a>
      <a href="/gallery/" class="mx-404__btn mx-404__btn--ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        逛画廊
      </a>
    </div>

    <div class="mx-404__subtools">
      <button class="mx-404__reroll" id="mx-404-reroll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        换一道题
      </button>
      <button class="mx-404__back" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        返回上一层
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  var numbers = ['404', '肆零肆', '4O4', '⁴⁰⁴', '④⓪④', '404…', '404?', '~404~', '404!', '(404)', '四零四', '404°', '¿404?', '404̇'];

  var topics = [
    { t: '这个页面像 <code>√(−1)</code> 一样，生活在虚数空间', s: '在实数轴上找不到它，但在复平面上……它就在那' },
    { t: '欧拉说 <code>e^(iπ) + 1 = 0</code>，但这个页面 <code>= 404</code>', s: '连最美的公式也救不了它' },
    { t: '你找到了黎曼 ζ 函数的非平凡零点……的邻居', s: '它实部是 0.5，但这个页面实部是 404' },
    { t: '这个页面的存在性，等价于停机问题', s: '图灵说：你永远无法判定它会不会出现' },
    { t: '康托尔说：有些无穷比另一些无穷大', s: '但这个页面比所有无穷都小——它是空集' },
    { t: '在非欧几何里，这个页面可能存在', s: '可惜我们的宇宙是欧几里得的' },
    { t: '费马大定理的证明太长了，放不下这个页面', s: '怀尔斯花了 200 页，这里只有 404' },
    { t: '这个页面被莫比乌斯带翻转了', s: '正面就是反面，里面就是外面，存在就是不存在' },
    { t: '薛定谔的页面：观测之前，它同时存在和不存在', s: '你一观测——坍缩成了 404' },
    { t: '这个页面藏在 π 的某位小数里', s: '但没人知道是第几位——可能是第 10<sup>100</sup> 位' },
    { t: '希尔伯特旅馆已满，但还能再塞一位客人', s: '可惜这位客人叫 404，他不肯入住' },
    { t: '这个页面的维度是 <code>2.71828…</code>', s: '不是整数维，所以你在整数坐标里找不到它' },
    { t: '404° = 404 × π/180 rad', s: '转了一整圈又多出 44°，还是没转到这个页面' },
    { t: '哥德尔不完备定理：这个页面既不能被找到，也不能被证明找不到', s: '系统内无解' },
    { t: '如果 <code>P = NP</code>，这个页面可以在多项式时间内找到', s: '但大多数人相信 P ≠ NP，所以……' },
    { t: '这个页面是马尔可夫链的吸收态', s: '一旦进入，就再也出不去了——但你也进不去' },
    { t: '洛必达法则：<code>lim 页面/存在 = 0/0</code>', s: '求导之后——还是 404' },
    { t: '这个页面在分形维度上自相似', s: '放大 404 倍，看到的还是 404' },
    { t: '泰勒展开：这个页面 <code>= 404 + 0 + 0 + …</code>', s: '所有高阶项都是零，只剩下一个 404' },
    { t: '这个页面是开集而不是闭集', s: '它不包含自己的边界——所以你永远到不了它' },
  ];

  var lastTopic = -1, lastNum = -1;

  function pick(arr, last) {
    var i;
    do { i = Math.floor(Math.random() * arr.length); } while (i === last && arr.length > 1);
    return i;
  }

  function reroll() {
    lastTopic = pick(topics, lastTopic);
    lastNum = pick(numbers, lastNum);

    var t = topics[lastTopic];
    var topicEl = document.getElementById('mx-404-topic');
    topicEl.innerHTML =
      '<h2 class="mx-404__topic-title">' + t.t + '</h2>' +
      '<p class="mx-404__topic-sub">' + t.s + '</p>';
    topicEl.style.animation = 'none';
    void topicEl.offsetWidth;
    topicEl.style.animation = 'mx-404-appear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';

    var numEl = document.getElementById('mx-404-number');
    numEl.textContent = numbers[lastNum];
  }

  var style = document.createElement('style');
  style.textContent = '@keyframes mx-404-appear { from { opacity: 0; transform: translateY(0.8rem) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }';
  document.head.appendChild(style);

  reroll();
  document.getElementById('mx-404-reroll').addEventListener('click', reroll);

  document.getElementById('mx-404-search').addEventListener('focus', function(e) {
    e.preventDefault();
    this.blur();
    var toggle = document.getElementById('__search');
    if (toggle) {
      toggle.checked = true;
      setTimeout(function() {
        var input = document.querySelector('.md-search__input');
        if (input) input.focus();
      }, 120);
    }
  });
})();
</script>

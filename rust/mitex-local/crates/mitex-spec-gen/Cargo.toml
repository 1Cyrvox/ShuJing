[package]
name = "mitex-spec-gen"
description = "Guard to geneate specification files for dependent crates"
authors = ["Myriad-Dreamin <camiyoru@gmail.com>", "OrangeX4 <orangex4@qq.com>", "mgt <mgt@oi-wiki.org>"]
version = "0.2.7"
license = "Apache-2.0"
edition = "2021"
homepage = "https://github.com/mitex-rs/mitex"
repository = "https://github.com/mitex-rs/mitex"

[dependencies]
mitex-spec = { version = "0.2.7", path = "../mitex-spec" }
once_cell = "1"
[build-dependencies]
mitex-spec = { version = "0.2.7", path = "../mitex-spec" }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.106"
anyhow = "1"
which = "6"
[lints.rust]
unused = "allow"

[features]
# use prebuilt spec data
prebuilt = []
# generate spec data
generate = []

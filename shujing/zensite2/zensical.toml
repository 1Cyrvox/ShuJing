# The docs site: https://zensical.org/docs/setup/basics/
# Build it with `just build-docs` (renders the examples and writes the reference first) into
# docs/site/, preview it with `just serve-docs`. Its paths are this folder's. Its navigation is
# its folders': the `.nav.yml` files (awesome-nav).

[project]
site_name = "数境 ShuJing"
site_url = "https://shujing.aipaikj.top/"
site_description = "中文数学动画引擎 · 基于 ManimGX · 极速 3D 数学动画"
site_author = "爱派未来科技"
copyright = "&copy; 2026 爱派未来科技"
repo_url = "https://github.com/1Cyrvox/ShuJing"
repo_name = "1Cyrvox/ShuJing"
docs_dir = "content"
site_dir = "site"
watch = ["templates"]
extra_css = ["stylesheets/manimgx.css", "stylesheets/sidebars.css"]
extra_javascript = ["javascripts/manimgx.js"]

[project.theme]
custom_dir = "overrides"
favicon = "images/favicon.svg"
language = "zh"
features = [
  # a page's one action: copying it as Markdown (the llmstxt plugin below writes it)
  "content.action.copy",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # a page carries only the navigation it shows: half the site's HTML
  "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Start with the system's preference; the toggle then switches between light and dark.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# 数境页脚配置（overrides/partials/academa.html）
[project.extra]
social_description = "数境 — 中文数学动画引擎，基于 ManimGX 中文适配衍生发行版。极速 3D 数学动画，兼容 Manim CE API。"
social = [
  { icon = "fontawesome/brands/github", name = "GitHub", link = "https://github.com/1Cyrvox/ShuJing" },
]

# A static sharing card: crawlers receive its absolute URL in the rendered head.
# Regenerate with `uv run --frozen python -m scripts.showcase.social`.
[project.extra.social_image]
path = "images/social-preview.png"
width = 1200
height = 630
alt = "数境 ShuJing — 中文数学动画引擎，基于 ManimGX 中文适配衍生发行版"

# Setting any extension replaces Zensical's defaults, so every extension is listed.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = { repo_url_shorthand = true, user = "1Cyrvox", repo = "ShuJing" }
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# the Welcome page is the README, included (its paths are the repository's)
pymdownx.snippets = { base_path = ["."], check_paths = true }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# The navigation, from the folders and their .nav.yml files
[project.plugins.awesome-nav]

